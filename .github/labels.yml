# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "Something fails, crashes, or reads or sends a wrong value"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from the protocol spec or from turborel-client"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory"
- name: "feature"
  color: "#a2eeef"
  description: "Something the driver should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/wrong-value"
  color: "#b60205"
  description: "A value read or sent wrongly, or data changed that should not be"
- name: "impact/crash"
  color: "#b60205"
  description: "An uncaught error, a fatal error or a hang"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

# Areas
- name: "area/codec"
  color: "#c5def5"
  description: "The frames, fields, tail, types and values, JSON and compression"
- name: "area/transport"
  color: "#c5def5"
  description: "TCP, Unix sockets, named pipes and timeouts"
- name: "area/auth"
  color: "#c5def5"
  description: "The mechanisms: trust, password, certificate and SCRAM"
- name: "area/tls"
  color: "#c5def5"
  description: "TLS, its modes and channel binding"
- name: "area/session"
  color: "#c5def5"
  description: "Connections and sessions: Hello, Ready, Status, notices, cancel"
- name: "area/statements"
  color: "#c5def5"
  description: "Queries, prepared statements, cursors and completions"
- name: "area/lobs"
  color: "#c5def5"
  description: "Large objects by locator, read and written in chunks"
- name: "area/copy"
  color: "#c5def5"
  description: "Copy, import and export"
- name: "area/settings"
  color: "#c5def5"
  description: "The URI, options, environment, service and password files, several hosts"
- name: "area/pipeline"
  color: "#c5def5"
  description: "Pipelines"
- name: "area/pool"
  color: "#c5def5"
  description: "Pools"
- name: "area/api"
  color: "#c5def5"
  description: "The PDO-style API and the package's root classes"
- name: "area/doc"
  color: "#c5def5"
  description: "doc/, README.md, RULES.md, CONFORMANCE.md, TODO.md, AGENTS.md, CONTRIBUTING.md"
- name: "area/ci"
  color: "#c5def5"
  description: "The workflows, issue forms and labels in .github/"
- name: "area/build"
  color: "#c5def5"
  description: "composer.json, the tools' configurations, tools/ and .githooks/"
- name: "dependencies"
  color: "#0366d6"
  description: "A development tool or a GitHub Action changes (R-DEP-1)"

# Triage
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
